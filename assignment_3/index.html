<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/styles.css">
  <title>Document</title>
</head>

<body>
  <header class="header">
    <div class=""></div>
  </header>

  <main>
    <section class="menu">
      <div class="menu__grid">
        <ol class="menu__tabs">
          <li class="tab">
            <span class="tab-title">Collection</span>
          </li>
          <li class="tab">
            <span class="tab-title">My playlist</span>
          </li>
        </ol>

        <!-- Actions -->

        <div class="menu__actions">
          <div class="action">
            <label for="filter">Filter by genre</label>
            <select name="filter" id="filter" class="filter-list">
              <option value="genre"></option>
            </select>
            <img src="./assets/icons/filter.svg" alt="filter" class="icon">
          </div>

          <div class="action">
            <label for="sort">Sort by</label>
            <select name="sort" id="sort" class="sort">
              <option value="#">Default</option>
              <option value="title">Title</option>
              <option value="artist">Artist</option>
              <option value="duration">Duration</option>
            </select>
            <img src="./assets/icons/sort.svg" alt="sorting arrows" class="icon">
          </div>

          <div class="action">
            <input type="search" name="search" id="search" placeholder="Search">
            <img src="./assets/icons/magnifying-glass.svg" alt="magnifying glass" class="icon">
          </div>
        </div>
      </div>
    </section>

    <!-- Music collection -->
    <section class="collection">
      <div class="collection__grid">
        <ol class="collection-items">
          <li class="item">
            <div class="add-item">
              <button type="button" class="add">+</button>
            </div>
            <div class="item__image"></div>
            <div class="item__title"></div>
            <div class="item__artist"></div>
            <div class="item__duration"></div>
          </li>
        </ol>
      </div>
    </section>

    <!-- Playlist section -->
    <section class="playlist">

    </section>
  </main>

  <footer class="footer"></footer>

  <script src="./data/songs.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
