<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/styles.css">
  <title>Document</title>
</head>

<body>
  <header class="header">
    <div class=""></div>
  </header>

  <main>
    <section class="menu">
      <div class="menu__grid">
        <ul class="menu__tabs">
          <li class="tab">
            <span class="tablink" onclick="openTab(0)" id="defaultOpen">Collection</span>
          </li>
          <li class="tab">
            <span class="tablink" onclick="openTab(1)">My playlist</span>
          </li>
        </ul>

        <!-- Actions -->

        <div class="menu__actions">
          <div class="action">
            <label for="filter">Genre</label>
            <select name="filter" id="filter" class="action__filter">
              <option value="All">All</option>
              <option value="Electronic">Electronic</option>
              <option value="Jazz">Jazz</option>
              <option value="Metal">Metal</option>
              <option value="Pop">Pop</option>
              <option value="Rock">Rock</option>
            </select>
            <button type="button" class="filter__button">
              <img src="./assets/icons/filter.svg" alt="filter" class="icon">
            </button>
          </div>

          <div class="action">
            <label for="sort">Sort by</label>
            <select name="sort" id="sort" class="action__sort">
              <option value="#">Default</option>
              <option value="title">Title</option>
              <option value="artist">Artist</option>
              <option value="duration">Duration</option>
            </select>
            <button type="button" class="sort__button">
              <img src="./assets/icons/sort.svg" alt="sorting arrows" class="icon">
            </button>
          </div>

          <div class="action">
            <input type="text" id="search" class="action__search" placeholder="Search">
            <button type="button" class="search__button">
              <img src="./assets/icons/magnifying-glass.svg" alt="magnifying glass" class="icon">
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Music collection -->
    <div class="tabcontent">
      <div class="panel">
        <div class="collection__card">
            <ul class="songs__list"></ul>
        </div>
      </div>
    </div>

    <!-- Playlist section -->
    <div class="tabcontent">
      <div class="panel">
        <p>test</p>
        <ul class="playlist"></ul>
      </div>
    </div>
  </main>

  <footer class="footer"></footer>

  <script src="./data/songs.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
